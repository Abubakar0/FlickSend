services:
  coturn:
    image: coturn/coturn:4.17.2-r0
    restart: unless-stopped
    command:
      - -n
      - --log-file=stdout
      - --realm=${TURN_REALM:?TURN_REALM is required}
      - --use-auth-secret
      - --static-auth-secret=${TURN_SHARED_SECRET:?TURN_SHARED_SECRET is required}
      - --lt-cred-mech
      - --fingerprint
      - --no-cli
      - --no-multicast-peers
      - --no-loopback-peers
      - --external-ip=${TURN_EXTERNAL_IP:?TURN_EXTERNAL_IP is required}
      - --min-port=49160
      - --max-port=49200
      # TLS/TURNS is intentionally disabled until a public hostname and certificate are qualified.
      - --no-tls
      - --no-dtls
    ports:
      - "3478:3478/tcp"
      - "3478:3478/udp"
      - "49160-49200:49160-49200/tcp"
      - "49160-49200:49160-49200/udp"
